<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>乱跑表情包｜C2科目二模拟考试</title>
<style>
:root{
  --bg:#07110c; --panel:rgba(8,18,14,.82); --panel2:rgba(13,27,21,.9);
  --line:rgba(255,255,255,.10); --text:#f6fff9; --muted:rgba(236,255,243,.58);
  --green:#48e596; --yellow:#ffd65a; --red:#ff5f65; --blue:#6bc5ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050907;color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#06100b;touch-action:none}
.hidden{display:none!important}

/* ---------- 首页 ---------- */
#menu{position:absolute;inset:0;z-index:1000;overflow:auto;background:
 radial-gradient(circle at 18% 12%,rgba(72,229,150,.15),transparent 35%),
 radial-gradient(circle at 88% 70%,rgba(83,125,255,.14),transparent 35%),
 linear-gradient(145deg,#08140e,#050806 64%,#030504)}
#menu:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 92%)}
.menu-inner{position:relative;width:min(1180px,92vw);margin:0 auto;padding:52px 0 60px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border:1px solid rgba(72,229,150,.22);border-radius:999px;background:rgba(72,229,150,.07);font-size:11px;color:#aaf3cd;letter-spacing:1px}
h1{font-size:clamp(34px,5vw,68px);line-height:1.05;margin-top:18px;letter-spacing:-2px;max-width:840px}
.lead{margin-top:16px;color:var(--muted);max-width:820px;line-height:1.8;font-size:14px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.primary,.secondary{height:52px;padding:0 22px;border-radius:15px;border:1px solid var(--line);cursor:pointer;font-weight:800;transition:.18s}
.primary{background:linear-gradient(135deg,#35d985,#169f5d);border-color:rgba(100,255,170,.3);box-shadow:0 18px 42px rgba(20,176,96,.22)}
.secondary{background:rgba(255,255,255,.055);backdrop-filter:blur(12px)}
.primary:hover,.secondary:hover{transform:translateY(-2px)}
.grid-title{margin-top:42px;font-size:13px;color:rgba(255,255,255,.46);letter-spacing:1.4px;text-transform:uppercase}
.project-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:12px}
.project-card{position:relative;min-height:178px;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));cursor:pointer;overflow:hidden;transition:.2s}
.project-card:hover{transform:translateY(-4px);border-color:rgba(72,229,150,.35);background:linear-gradient(145deg,rgba(72,229,150,.11),rgba(255,255,255,.025))}
.project-no{font-size:11px;color:var(--green);font-weight:900;letter-spacing:1px}
.project-card h3{margin-top:15px;font-size:18px}
.project-card p{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.65}
.project-card .mini{position:absolute;right:-16px;bottom:-20px;font-size:78px;opacity:.08;filter:grayscale(1)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.rule{padding:14px 15px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.035)}
.rule b{font-size:13px}.rule span{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
.topbar{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud-group{display:flex;gap:8px;pointer-events:auto}
.hud-card{min-width:92px;padding:9px 12px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(6,13,10,.74);backdrop-filter:blur(15px);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.hud-card label{display:block;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.38)}
.hud-card strong{display:block;margin-top:2px;font-size:17px}
#scoreValue.good{color:var(--green)}#scoreValue.warn{color:var(--yellow)}#scoreValue.bad{color:var(--red)}
.icon{width:46px;height:46px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(6,13,10,.76);backdrop-filter:blur(15px);cursor:pointer;pointer-events:auto}
.stage-panel{position:absolute;left:14px;top:84px;width:min(370px,calc(100vw - 28px));padding:14px 15px;border:1px solid rgba(255,255,255,.09);border-radius:17px;background:rgba(6,13,10,.70);backdrop-filter:blur(14px)}
.stage-panel .tag{display:inline-block;padding:4px 7px;border-radius:7px;background:rgba(72,229,150,.12);color:#94efbf;font-size:9px;font-weight:900;letter-spacing:1px}
.stage-panel h2{margin-top:7px;font-size:18px}.stage-panel p{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}
#timerBar{height:3px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
#timerFill{height:100%;width:100%;background:var(--green);transform-origin:left center}

/* ---------- 仪表 ---------- */
.telemetry{position:absolute;left:14px;bottom:18px;display:flex;gap:8px;align-items:flex-end}
.gauge{width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle,rgba(21,40,31,.92),rgba(6,12,9,.94));box-shadow:inset 0 0 34px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .num{font-size:28px;font-weight:900}.gauge .unit{font-size:9px;color:var(--muted)}
.small-gauge{padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(6,13,10,.72);backdrop-filter:blur(12px);min-width:90px}
.small-gauge label{display:block;color:var(--muted);font-size:9px}.small-gauge strong{display:block;margin-top:4px;font-size:15px}

/* ---------- 操作区 ---------- */
#controls{position:absolute;inset:0;z-index:70;pointer-events:none}
.steer-wrap{position:absolute;left:24px;bottom:28px;width:210px;height:210px;display:none;pointer-events:auto}
#steerWheel{position:absolute;inset:0;border-radius:50%;border:12px solid rgba(236,255,243,.18);background:radial-gradient(circle,rgba(255,255,255,.04) 0 22%,transparent 23%),rgba(8,16,12,.68);box-shadow:0 18px 45px rgba(0,0,0,.4),inset 0 0 24px rgba(0,0,0,.45);touch-action:none}
#steerWheel:before,#steerWheel:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:82px;border-radius:7px;background:rgba(236,255,243,.20);transform-origin:50% 6px}
#steerWheel:before{transform:translate(-50%,-6px) rotate(120deg)}#steerWheel:after{transform:translate(-50%,-6px) rotate(-120deg)}
.wheel-spoke{position:absolute;left:50%;top:50%;width:12px;height:82px;border-radius:7px;background:rgba(236,255,243,.20);transform:translate(-50%,-6px)}
.wheel-center{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(#23372d,#0c1711);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.pedals{position:absolute;right:22px;bottom:28px;display:flex;gap:9px;align-items:flex-end;pointer-events:auto}
.pedal{width:74px;height:112px;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));backdrop-filter:blur(12px);font-size:12px;font-weight:900;cursor:pointer;touch-action:none}
.pedal.active{transform:translateY(5px);background:linear-gradient(180deg,rgba(72,229,150,.25),rgba(72,229,150,.08));border-color:rgba(72,229,150,.35)}
.pedal.brake.active{background:linear-gradient(180deg,rgba(255,95,101,.25),rgba(255,95,101,.08));border-color:rgba(255,95,101,.35)}
.gearbox{position:absolute;right:22px;bottom:154px;display:flex;gap:6px;pointer-events:auto}
.gear,.signal,.handbrake{height:42px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(6,13,10,.75);backdrop-filter:blur(12px);cursor:pointer;font-size:11px;font-weight:900}
.gear.active{color:#07110c;background:var(--green);border-color:var(--green)}
.handbrake.active{color:white;background:#c43b44;border-color:#ff7075}
.signals{position:absolute;right:22px;bottom:204px;display:flex;gap:6px;pointer-events:auto}
.signal.active{background:rgba(255,214,90,.22);color:var(--yellow);border-color:rgba(255,214,90,.35)}
.keyboard-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border:1px solid rgba(255,255,255,.07);border-radius:99px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.42);font-size:9px;white-space:nowrap}

/* ---------- 提示 / 弹窗 ---------- */
#toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-10px);padding:10px 14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(7,14,11,.88);backdrop-filter:blur(14px);font-size:12px;opacity:0;transition:.2s;z-index:100;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.34)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.error{border-color:rgba(255,95,101,.3);color:#ffb8bc}#toast.ok{border-color:rgba(72,229,150,.3);color:#b9f7d7}
.overlay{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(1,4,2,.60);backdrop-filter:blur(12px)}
.dialog{width:min(430px,92vw);padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(20,38,29,.98),rgba(6,12,9,.98));box-shadow:0 35px 100px rgba(0,0,0,.55)}
.dialog .badge{display:inline-flex;padding:5px 8px;border-radius:8px;background:rgba(72,229,150,.1);color:#8ff0ba;font-size:9px;font-weight:900;letter-spacing:1px}
.dialog h2{font-size:25px;margin-top:10px}.dialog p{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.7}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.result{padding:12px 6px;text-align:center;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(255,255,255,.035)}.result span{display:block;color:var(--muted);font-size:9px}.result b{display:block;margin-top:3px;font-size:20px}
.dialog-actions{display:flex;gap:8px;margin-top:18px}.dialog-actions button{flex:1}
.penalty-list{max-height:180px;overflow:auto;margin-top:14px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px}.penalty-item{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted);padding:5px 0}.penalty-item b{color:#ff9ca1;white-space:nowrap}

@media(max-width:900px){
 .project-grid{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:1fr}.steer-wrap{display:block;width:160px;height:160px;left:12px;bottom:18px}.pedals{right:10px;bottom:18px}.pedal{width:62px;height:96px}.gearbox{right:10px;bottom:124px}.signals{right:10px;bottom:172px}.telemetry{display:none}.keyboard-hint{display:none}.stage-panel{top:72px}.hud-card{min-width:72px;padding:7px 9px}.hud-card strong{font-size:14px}.topbar{left:9px;right:9px;top:9px}.project-card{min-height:150px}.menu-inner{padding-top:30px}}
@media(max-width:520px){.project-grid{grid-template-columns:1fr 1fr}.project-card{padding:14px}.project-card h3{font-size:15px}.project-card p{font-size:10px}.stage-panel{width:calc(100vw - 18px);left:9px}.hud-group .hud-card:nth-child(3){display:none}.steer-wrap{width:142px;height:142px}.pedal{width:57px;height:88px}.pedals{gap:5px}.signals,.gearbox{right:8px}.gear,.signal,.handbrake{padding:0 8px;min-width:39px}}

/* ===== 保留原第一网页 ===== */
#homePage{width:100%;height:100%;position:absolute;top:0;left:0;z-index:1200;overflow:hidden;background:radial-gradient(circle at 20% 10%,#2b1b35 0%,#121218 50%,#050508 100%)}
#homePage .home-title{position:fixed;top:24px;width:100%;text-align:center;color:rgba(255,255,255,.65);font-size:15px;letter-spacing:1px;pointer-events:none;z-index:20}
#homePhoto{position:absolute;width:30vmin;height:30vmin;min-width:120px;min-height:120px;max-width:260px;max-height:260px;border-radius:22px;overflow:hidden;cursor:pointer;user-select:none;box-shadow:0 0 40px rgba(255,180,80,.32),0 12px 40px rgba(0,0,0,.7);z-index:10}
#homePhoto img{width:100%;height:100%;object-fit:cover;display:block}
#homePhoto .pauseBadge{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);font-size:34px}
#homePhoto.is-paused .pauseBadge{display:flex}
.home-spark{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,80,.6) 0%,transparent 70%);pointer-events:none;animation:homeSpark .45s ease-out forwards;z-index:5}
@keyframes homeSpark{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#homeControlBar{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:100}
.home-tip{color:#fff;font-size:13px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);white-space:nowrap}
#enterExamBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:linear-gradient(135deg,#ff7a4f,#ff4f32);color:white;border:none;padding:14px 32px;border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 14px 36px rgba(255,82,48,.28)}
#enterExamBtn:hover{transform:translateX(-50%) translateY(-2px)}
#game{display:none}


/* ===== 竖屏优先 · 手机驾驶按钮重做版 ===== */
.legacy-controls{display:none!important}
#controls{position:absolute;inset:0;z-index:90;pointer-events:none}
.mobile-bottom-dock{
  position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;pointer-events:none;
}
.mobile-drive-ui{
  position:relative;left:auto;right:auto;bottom:auto;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;pointer-events:none;
}
.simple-card{
  min-width:0;pointer-events:auto;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:20px;
  background:linear-gradient(180deg,rgba(11,19,16,.94),rgba(6,12,10,.84));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 14px 38px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.05)
}
.pad-label{text-align:center;color:rgba(255,255,255,.44);font-size:9px;letter-spacing:1.3px;margin:0 0 6px}
.steer-row,.drive-row{display:grid;align-items:center;gap:10px}
.steer-row{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr)}
.drive-row{grid-template-columns:repeat(3,minmax(0,1fr))}
.steer-key,.center-key,.drive-key{
  min-width:0;border:1px solid rgba(255,255,255,.11);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.05);touch-action:none;cursor:pointer;
  -webkit-user-select:none;user-select:none;outline:none
}
.steer-key{height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.steer-key .steer-icon{font-size:24px;line-height:1}.steer-key small,.center-key small{font-size:9px;color:rgba(255,255,255,.68)}
.steer-key.active{transform:translateY(2px) scale(.985);border-color:rgba(107,197,255,.55);background:linear-gradient(180deg,rgba(76,164,255,.28),rgba(76,164,255,.08));box-shadow:0 0 24px rgba(76,164,255,.14)}
.center-key{height:64px;border-radius:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}
.steer-meter{position:relative;width:32px;height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:visible}
.steer-meter:after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:13px;background:rgba(255,255,255,.35)}
.steer-meter i{position:absolute;top:-2px;left:50%;width:11px;height:11px;border-radius:50%;background:#6bc5ff;box-shadow:0 0 14px rgba(107,197,255,.65);transform:translateX(-50%);transition:left .06s linear}
.drive-key{height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.drive-key span{font-size:16px;line-height:1}.drive-key b{font-size:10px}.drive-key.forward{border-color:rgba(72,229,150,.18)}.drive-key.reverse{border-color:rgba(107,197,255,.18)}.drive-key.brake{border-color:rgba(255,95,101,.18)}
.drive-key.forward.active{transform:translateY(2px);background:linear-gradient(180deg,rgba(72,229,150,.30),rgba(72,229,150,.08));border-color:rgba(72,229,150,.55);box-shadow:0 0 24px rgba(72,229,150,.12)}
.drive-key.reverse.active{transform:translateY(2px);background:linear-gradient(180deg,rgba(107,197,255,.28),rgba(107,197,255,.08));border-color:rgba(107,197,255,.55)}
.drive-key.brake.active{transform:translateY(2px);background:linear-gradient(180deg,rgba(255,95,101,.30),rgba(255,95,101,.09));border-color:rgba(255,95,101,.58)}
.quick-strip{
  position:relative;left:auto;bottom:auto;transform:none;display:grid;
  grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr) minmax(0,1fr);align-items:center;gap:9px;
  width:100%;pointer-events:auto;padding:8px;border-radius:17px;border:1px solid rgba(255,255,255,.08);
  background:rgba(4,9,7,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.quick-btn{min-width:0;height:36px;padding:0 5px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);font-size:9px;font-weight:800;color:rgba(255,255,255,.76);touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-btn.active{color:#ffd65a;border-color:rgba(255,214,90,.4);background:rgba(255,214,90,.12)}
.quick-btn.park.active{color:#fff;border-color:rgba(255,95,101,.5);background:rgba(255,95,101,.18)}
.gear-pill{height:36px;min-width:0;border-radius:10px;border:1px solid rgba(72,229,150,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(72,229,150,.08)}
.gear-pill span{font-size:15px;font-weight:900;color:#8ff0ba;line-height:1}.gear-pill small{font-size:7px;color:rgba(255,255,255,.38);margin-top:2px}
.mobile-help{position:relative;left:auto;bottom:auto;transform:none;font-size:8px;line-height:1.3;color:rgba(255,255,255,.42);text-align:center;padding:0 4px;white-space:normal;pointer-events:none}
.stage-panel{max-width:330px;padding:11px 13px}.stage-panel h2{font-size:16px}.stage-panel p{font-size:10px}
.topbar .hud-card{min-width:70px;padding:7px 9px}.topbar .hud-card strong{font-size:14px}.topbar .hud-card label{font-size:8px}
.icon{width:40px;height:40px;border-radius:12px}.telemetry{display:none}
#guideBtn{font-size:0}#guideBtn:after{content:"辅助";font-size:9px;font-weight:800}

@media (orientation:portrait) and (max-width:700px){
  .topbar{top:8px;left:8px;right:8px}.hud-group{gap:5px}.topbar .hud-card{min-width:58px;padding:6px 7px}.topbar .hud-card strong{font-size:12px}.topbar .hud-card label{font-size:7px}.icon{width:36px;height:36px}
  .topbar .hud-group:first-child .hud-card:nth-child(3){display:none}
  .stage-panel{top:62px;left:8px;width:calc(100vw - 16px);max-width:none;padding:9px 10px;border-radius:15px}.stage-panel h2{font-size:15px;margin-top:4px}.stage-panel p{font-size:9px;margin-top:3px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 竖屏改为上下两排：每个按钮更宽，避免挤在一起 */
  .mobile-bottom-dock{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));gap:10px}
  .mobile-drive-ui{grid-template-columns:1fr;gap:10px}
  .simple-card{padding:8px 10px;border-radius:19px}
  .pad-label{margin-bottom:7px}
  .steer-row{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:12px}
  .drive-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

<body>
<div id="app">
  <canvas id="game"></canvas>

  <section id="homePage">

  <section id="hud" class="hidden">

    <div class="stage-panel">
      <div class="tag" id="modeTag">模拟考试</div>
      <h2 id="stageTitle">倒车入库</h2>
      <p id="stageHint">按考试线路完成项目。</p>
      <div id="timerBar"><div id="timerFill"></div></div>

    <div class="telemetry">
      <div class="gauge"><div class="num" id="speedValue">0.0</div><div class="unit">km/h</div></div>

      <div class="gearbox"><button class="gear" data-gear="D">D挡</button><button class="gear active" data-gear="N">N</button><button class="gear" data-gear="R">R挡</button><button class="handbrake active" id="handbrakeBtn">手刹</button></div>
      <div class="pedals"><button class="pedal" id="clutchBtn">离合</button><button class="pedal brake" id="brakeBtn">刹车</button><button class="pedal" id="throttleBtn">油门</button></div>

  <div class="overlay hidden" id="resultOverlay"><div class="dialog"><div class="badge" id="resultBadge">RESULT</div><h2 id="resultTitle">考试结束</h2><p id="resultDesc"></p><div class="fail-photo-wrap" id="failPhotoWrap"><img id="failPhoto" src="66ae5595-ecf6-406b-97da-5c3377c17191.png" alt="考试不合格提示图片" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/bl1702970-ctrl/weisen/main/66ae5595-ecf6-406b-97da-5c3377c17191.png';"><div class="fail-photo-caption">考试不合格</div></div><div class="result-grid"><div class="result"><span>成绩</span><b id="finalScore">100</b></div><div class="result"><span>完成项目</span><b id="finalProject">4/4</b></div><div class="result"><span>用时</span><b id="finalTime">0:00</b></div></div><div class="penalty-list" id="penaltyList"></div><div class="dialog-actions"><button class="primary" id="retryBtn">重新开始</button><button class="secondary" id="resultQuitBtn">返回首页</button></div></div></div>
</div>
<script>
// ===== 原第一网页逻辑 =====
const HOME_IMAGES = [
  'f57b7468deb628469350c27aad31d26e.png',
  '10067dde-a329-416b-b6f4-98d5ee70d8ea.png',
  '5706dfe1-7d73-45e1-8f2a-95de54c2d788.png'
];
let homeImageIndex=0;
const homePageEl=document.getElementById('homePage');
const homePhoto=document.getElementById('homePhoto');
const homeImg=document.getElementById('homeImg');
let homeX=innerWidth*.12, homeY=innerHeight*.12;
let homeVX=(Math.random()*170+95)*(Math.random()>.5?1:-1);
let homeVY=(Math.random()*170+95)*(Math.random()>.5?1:-1);
let homeRunning=true, homeLast=performance.now();
function homeSpark(x,y){const e=document.createElement('div');e.className='home-spark';e.style.left=x+'px';e.style.top=y+'px';homePageEl.appendChild(e);setTimeout(()=>e.remove(),460)}
function homeLoop(now){
  const dt=Math.min(.033,(now-homeLast)/1000);homeLast=now;
  if(homeRunning && homePageEl.style.display!=='none'){
    const w=homePhoto.offsetWidth,h=homePhoto.offsetHeight; let hit=false;
    homeX+=homeVX*dt;homeY+=homeVY*dt;
    if(homeX<=0){homeX=0;homeVX=Math.abs(homeVX);hit=true}
    if(homeX+w>=innerWidth){homeX=innerWidth-w;homeVX=-Math.abs(homeVX);hit=true}
    if(homeY<=0){homeY=0;homeVY=Math.abs(homeVY);hit=true}
    if(homeY+h>=innerHeight){homeY=innerHeight-h;homeVY=-Math.abs(homeVY);hit=true}
    if(hit) homeSpark(homeX+w/2,homeY+h/2);
    homePhoto.style.left=homeX+'px';homePhoto.style.top=homeY+'px';
  }
  requestAnimationFrame(homeLoop);
}
requestAnimationFrame(homeLoop);
homePhoto.addEventListener('click',e=>{e.stopPropagation();homeRunning=!homeRunning;homePhoto.classList.toggle('is-paused',!homeRunning)});
homePageEl.addEventListener('click',e=>{
  if(e.target.closest('#homePhoto')||e.target.closest('#enterExamBtn')||e.target.closest('#homeControlBar')) return;
  homeImageIndex=(homeImageIndex+1)%HOME_IMAGES.length;homeImg.src=HOME_IMAGES[homeImageIndex];
  window.__selectedRoofIndex=homeImageIndex;
});
addEventListener('resize',()=>{const w=homePhoto.offsetWidth,h=homePhoto.offsetHeight;homeX=Math.max(0,Math.min(homeX,innerWidth-w));homeY=Math.max(0,Math.min(homeY,innerHeight-h))});

(() => {
'use strict';

/* =========================================================
   1. 资源与全局配置
   把这三个文件与 HTML 放在同一目录即可显示在车顶。
========================================================= */
const ROOF_IMAGES = [
  'f57b7468deb628469350c27aad31d26e.png',
  '10067dde-a329-416b-b6f4-98d5ee70d8ea.png',
  '5706dfe1-7d73-45e1-8f2a-95de54c2d788.png'
];
const roofImgs = ROOF_IMAGES.map(src => { const im = new Image(); im.src = src; return im; });
let roofIndex = 0;

const CAR = { length:4.62, width:1.78, wheelbase:2.68, maxSteer:34*Math.PI/180 };
const RULES = {
  passScore:80,
  reverseLimit:210,
  sideLimit:90,
  stopThreshold:0.06,
  midStopSeconds:2.0,
  midStopPenalty:5
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = Math.min(devicePixelRatio || 1, 2);
function resize(){ DPR=Math.min(devicePixelRatio||1,2); canvas.width=innerWidth*DPR; canvas.height=innerHeight*DPR; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

const $ = id => document.getElementById(id);
const homePage=$('homePage'), hud=$('hud'), controls=$('controls');
const scoreEl=$('scoreValue'), projectEl=$('projectValue'), timeEl=$('timeValue');
const stageTitle=$('stageTitle'), stageHint=$('stageHint'), timerFill=$('timerFill'), modeTag=$('modeTag');
const speedEl=$('speedValue'), gearEl=$('gearValue'), rpmEl=$('rpmValue'), gradeEl=$('gradeValue');
const resultOverlay=$('resultOverlay'), pauseOverlay=$('pauseOverlay');

// C2 小型自动挡汽车科目二：倒车入库、侧方停车、曲线行驶、直角转弯（不考坡道定点停车和起步）
const PROJECTS = [
  { id:'reverse', name:'倒车入库', icon:'🅿️', desc:'右倒库 → 左出库 → 左倒库 → 右出库；限时 210 秒。' },
  { id:'side', name:'侧方停车', icon:'↩️', desc:'倒入道路右侧车位并驶出；限时 90 秒，注意转向灯。' },
  { id:'curve', name:'曲线行驶', icon:'〰️', desc:'保持车轮在 S 弯道路范围内，连续低速通过。' },
  { id:'right', name:'直角转弯', icon:'↱', desc:'控制内轮差完成 90° 右转，不压道路边线。' }
];

/* =========================================================
   2. UI 初始化
========================================================= */
$('enterExamBtn').onclick=()=>{
  roofIndex = Number.isInteger(window.__selectedRoofIndex) ? window.__selectedRoofIndex : homeImageIndex;
  startSession('exam',0);
};
$('quitBtn').onclick=quitToMenu;
$('pauseQuitBtn').onclick=quitToMenu;
$('resultQuitBtn').onclick=quitToMenu;
$('pauseBtn').onclick=()=>setPause(true);
$('resumeBtn').onclick=()=>setPause(false);
$('retryBtn').onclick=()=>startSession('exam',0);
$('guideBtn').onclick=()=>{session.guide=!session.guide;$('guideBtn').style.color=session.guide?'var(--green)':'';};

/* =========================================================
   3. 手机简易输入
   - C2 自动挡：不需要离合/手动挡位操作
   - 前进/倒车自动切换挡位
   - 停稳后自动驻车
   - 左右按住转向，松开自动回正
========================================================= */
const input={drive:0,brake:0,steer:0};
let gear='N',handbrake=true,engineOn=true,signal='off';
const keys={};
let touchDrive=0,touchBrake=0,turnLeftHeld=false,turnRightHeld=false,autoHoldClock=0;

function vibrate(ms=12){try{navigator.vibrate?.(ms)}catch(e){}}
function pressState(el,on){el?.classList.toggle('active',on)}
function bindHold(id,onDown,onUp){
  const el=$(id); if(!el)return;
  const down=e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);pressState(el,true);vibrate();onDown?.();};
  const up=e=>{e?.preventDefault?.();pressState(el,false);onUp?.();};
  el.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up));
}

bindHold('forwardBtn',()=>{touchDrive=1;handbrake=false;},()=>{touchDrive=0;});
bindHold('reverseBtn',()=>{touchDrive=-1;handbrake=false;},()=>{touchDrive=0;});
bindHold('brakeBtn2',()=>{touchBrake=1;},()=>{touchBrake=0;});
bindHold('turnLeftBtn',()=>{turnLeftHeld=true;},()=>{turnLeftHeld=false;});
bindHold('turnRightBtn',()=>{turnRightHeld=true;},()=>{turnRightHeld=false;});

$('centerBtn').addEventListener('click',()=>{input.steer=0;updateSteerVisual();vibrate();});
$('parkBtn').addEventListener('click',()=>{handbrake=!handbrake;if(handbrake&&Math.abs(car.speed)<.25)car.speed=0;syncControls();vibrate();});
$('leftSignal2').addEventListener('click',()=>toggleSignal('left'));
$('rightSignal2').addEventListener('click',()=>toggleSignal('right'));

addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='z')toggleSignal('left');
  if(e.key.toLowerCase()==='x')toggleSignal('right');
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function toggleSignal(s){signal=signal===s?'off':s;syncControls();vibrate();}
function updateSteerVisual(){
  const marker=$('steerMarker'); if(marker)marker.style.left=`${50+input.steer*43}%`;
}
function syncControls(){
  $('simpleGear').textContent=gear;
  $('parkBtn').classList.toggle('active',handbrake);
  $('leftSignal2').classList.toggle('active',signal==='left');
  $('rightSignal2').classList.toggle('active',signal==='right');
  // 隐藏兼容控件仍保持状态
  document.querySelectorAll('.gear').forEach(b=>b.classList.toggle('active',b.dataset.gear===gear));
  $('handbrakeBtn')?.classList.toggle('active',handbrake);
  $('leftSignal')?.classList.toggle('active',signal==='left');
  $('rightSignal')?.classList.toggle('active',signal==='right');
}

/* =========================================================
   4. 手机低速车辆模型
   目标是“像车”但操作不复杂：自动挡、自动离合、低速限速。
========================================================= */
const car={x:0,y:0,heading:0,speed:0,rpm:850,stalled:false,grade:0,lastX:0,lastY:0};
const camera={x:0,y:0,scale:55};
function resetCar(spawn){
  Object.assign(car,{x:spawn.x,y:spawn.y,heading:spawn.h,speed:0,rpm:850,stalled:false,grade:0,lastX:spawn.x,lastY:spawn.y});
  gear='N';handbrake=true;signal='off';engineOn=true;input.drive=0;input.brake=0;input.steer=0;touchDrive=0;touchBrake=0;turnLeftHeld=false;turnRightHeld=false;autoHoldClock=0;
  updateSteerVisual();syncControls();camera.x=car.x;camera.y=car.y;
}
function currentGrade(){return 0;}
function approach(v,target,amount){return v<target?Math.min(v+amount,target):Math.max(v-amount,target);}
function updateInputs(dt){
  const keyDrive=keys['w']?1:keys['s']?-1:0;
  input.drive=keyDrive||touchDrive;
  input.brake=(keys[' ']?1:0)||touchBrake;
  const l=turnLeftHeld||keys['a'];
  const r=turnRightHeld||keys['d'];
  const target=l&&!r?-1:r&&!l?1:0;
  const rate=target===0?2.8:1.65;
  input.steer=approach(input.steer,target,rate*dt);
  input.steer=Math.max(-1,Math.min(1,input.steer));
  updateSteerVisual();

  if(input.drive>0){gear='D';handbrake=false;}
  else if(input.drive<0){gear='R';handbrake=false;}
  syncControls();
}
function updateCar(dt){
  if(!session.running||session.paused)return;
  updateInputs(dt);
  car.grade=currentGrade();

  const desired=input.drive>0?1.38:input.drive<0?-1.05:0; // 约 5km/h / 3.8km/h
  if(input.brake){
    car.speed=approach(car.speed,0,4.8*dt);
    if(Math.abs(car.speed)<.04){car.speed=0;handbrake=true;autoHoldClock=0;}
  }else if(handbrake&&input.drive===0){
    car.speed=approach(car.speed,0,6.5*dt);
    if(Math.abs(car.speed)<.02)car.speed=0;
  }else if(input.drive!==0){
    // 自动离合 + 自动挡：平顺向目标低速加速
    const accel=(Math.sign(desired)===Math.sign(car.speed)||Math.abs(car.speed)<.05)?1.85:3.0;
    car.speed=approach(car.speed,desired,accel*dt);
    autoHoldClock=0;
  }else{
    // 松开前进/倒车后自然减速；C2 为自动挡，不设置坡道起步考试项目
    car.speed=approach(car.speed,0,0.72*dt);
    if(car.grade>0&&!handbrake&&Math.abs(car.speed)<.32)car.speed-=0.34*dt;
    if(Math.abs(car.speed)<.035){
      autoHoldClock+=dt;
      if(autoHoldClock>.42){car.speed=0;handbrake=true;}
    }else autoHoldClock=0;
  }

  car.speed=Math.max(-1.18,Math.min(1.5,car.speed));
  const steer=input.steer*CAR.maxSteer;
  if(Math.abs(car.speed)>.004)car.heading+=(car.speed/CAR.wheelbase)*Math.tan(steer)*dt;
  car.lastX=car.x;car.lastY=car.y;
  car.x+=Math.cos(car.heading)*car.speed*dt;
  car.y+=Math.sin(car.heading)*car.speed*dt;
  car.rpm=900+Math.abs(car.speed)*520+(input.drive!==0?380:0);
  syncControls();
}

/* =========================================================
   5. 几何工具
========================================================= */
const rect=(x1,y1,x2,y2)=>({x1:Math.min(x1,x2),y1:Math.min(y1,y2),x2:Math.max(x1,x2),y2:Math.max(y1,y2)});
function pointInRect(p,r){return p.x>=r.x1&&p.x<=r.x2&&p.y>=r.y1&&p.y<=r.y2;}
function pointInAnyRect(p,arr){return arr.some(r=>pointInRect(p,r));}
function carPoints(){
  const c=Math.cos(car.heading),s=Math.sin(car.heading),L=CAR.length/2,W=CAR.width/2;
  const local=[{x:L,y:W},{x:L,y:-W},{x:-L,y:W},{x:-L,y:-W}];
  return local.map(p=>({x:car.x+p.x*c-p.y*s,y:car.y+p.x*s+p.y*c}));
}
function frontCenter(){return {x:car.x+Math.cos(car.heading)*CAR.length/2,y:car.y+Math.sin(car.heading)*CAR.length/2};}
function rearCenter(){return {x:car.x-Math.cos(car.heading)*CAR.length/2,y:car.y-Math.sin(car.heading)*CAR.length/2};}
function fullyInside(r){return carPoints().every(p=>pointInRect(p,r));}
function distToSeg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,wx=p.x-a.x,wy=p.y-a.y;const c1=vx*wx+vy*wy,c2=vx*vx+vy*vy;const t=Math.max(0,Math.min(1,c1/c2));const x=a.x+t*vx,y=a.y+t*vy;return Math.hypot(p.x-x,p.y-y);}
function distToPolyline(p,pts){let d=Infinity;for(let i=0;i<pts.length-1;i++)d=Math.min(d,distToSeg(p,pts[i],pts[i+1]));return d;}
function crossedX(prevX,x,line,dir=0){return dir===0?((prevX-line)*(x-line)<=0):dir>0?(prevX<line&&x>=line):(prevX>line&&x<=line);}

/* =========================================================
   6. 项目地图与判定
========================================================= */
function makeReverse(){
  return {
    id:'reverse',name:'倒车入库',limit:RULES.reverseLimit,spawn:{x:7.3,y:0,h:Math.PI},step:0,stepText:['右侧倒车入库：车辆完全入库并停车','左出库：前轮越过左侧控制线','左侧倒车入库：车辆完全入库并停车','右出库：驶过右侧控制线完成项目'],
    road:[rect(-10,-3.7,10,3.5),rect(-1.65,3.5,1.65,8.9)],bay:rect(-1.65,3.5,1.65,8.9),leftLine:-7.0,rightLine:7.0,
    update(dt){
      const prev=session.prevCarX;
      if(!carPoints().every(p=>pointInAnyRect(p,this.road)))return fail('车身出线 / 车轮压越边线');
      if(this.step===0&&fullyInside(this.bay)&&Math.abs(car.speed)<RULES.stopThreshold&&gear==='R'){this.step=1;toast('右倒库完成，请从左侧驶出','ok');}
      else if(this.step===1&&crossedX(prev,frontCenter().x,this.leftLine,-1)&&gear==='D'){this.step=2;toast('请完成左侧倒车入库','ok');}
      else if(this.step===2&&fullyInside(this.bay)&&Math.abs(car.speed)<RULES.stopThreshold&&gear==='R'){this.step=3;toast('左倒库完成，请向右驶出','ok');}
      else if(this.step===3&&crossedX(prev,rearCenter().x,this.rightLine,1)&&gear==='D'){completeProject();}
      this.checkMidStop(dt);
    },
    stopClock:0,stopLatched:false,checkMidStop(dt){
      const shouldMove=!fullyInside(this.bay)&&this.step<4;
      if(shouldMove&&Math.abs(car.speed)<.025&&!handbrake){this.stopClock+=dt;if(this.stopClock>RULES.midStopSeconds&&!this.stopLatched){this.stopLatched=true;penalty(5,'倒车入库中途停车');toast('中途停车 -5','error');}}else{this.stopClock=0;this.stopLatched=false;}
    },
    draw(){drawGrass();drawRectRoad(rect(-10,-3.7,10,3.5));drawRectRoad(this.bay);drawLine(-10,-3.7,10,-3.7);drawLine(-10,3.5,-1.65,3.5);drawLine(1.65,3.5,10,3.5);drawLine(-1.65,3.5,-1.65,8.9);drawLine(1.65,3.5,1.65,8.9);drawLine(-1.65,8.9,1.65,8.9);drawControlX(this.leftLine,-3.7,3.5);drawControlX(this.rightLine,-3.7,3.5);if(session.guide)drawGhostBay(this.bay,'倒车库');}
  };
}
function makeSide(){
  return {
    id:'side',name:'侧方停车',limit:RULES.sideLimit,spawn:{x:6.8,y:0,h:Math.PI},step:0,stepText:['挂 R 挡倒入右侧车位并停车','开启左转向灯，挂 D 挡驶出项目'],
    road:[rect(-10,-2.4,10,2.4),rect(-2.9,2.4,3.7,5.15)],bay:rect(-2.9,2.4,3.7,5.15),finishX:-7.2,signalChecked:false,
    update(dt){
      const prev=session.prevCarX;
      if(!carPoints().every(p=>pointInAnyRect(p,this.road)))return fail('侧方停车：车身出线 / 压越边线');
      if(this.step===0&&fullyInside(this.bay)&&Math.abs(car.speed)<RULES.stopThreshold){this.step=1;toast('已入库：出库前请开启左转向灯','ok');}
      if(this.step===1){if(gear==='D'&&Math.abs(car.speed)>.1&&!this.signalChecked){this.signalChecked=true;if(signal!=='left')penalty(10,'侧方出库未使用左转向灯');}
        if(crossedX(prev,car.x,this.finishX,-1)&&gear==='D')completeProject();}
      this.checkMidStop(dt);
    },
    stopClock:0,stopLatched:false,checkMidStop(dt){if(this.step===0&&!fullyInside(this.bay)&&Math.abs(car.speed)<.025&&!handbrake){this.stopClock+=dt;if(this.stopClock>2&&!this.stopLatched){this.stopLatched=true;penalty(5,'侧方停车中途停车');}}else{this.stopClock=0;this.stopLatched=false;}},
    draw(){drawGrass();drawRectRoad(rect(-10,-2.4,10,2.4));drawRectRoad(this.bay);drawLine(-10,-2.4,10,-2.4);drawLine(-10,2.4,-2.9,2.4);drawLine(3.7,2.4,10,2.4);drawLine(-2.9,2.4,-2.9,5.15);drawLine(3.7,2.4,3.7,5.15);drawLine(-2.9,5.15,3.7,5.15);drawControlX(this.finishX,-2.4,2.4);if(session.guide)drawGhostBay(this.bay,'侧方位');}
  };
}
function makeCurve(){
  const pts=[];for(let x=-10;x<=10;x+=.25){pts.push({x,y:2.25*Math.sin((x+10)/20*Math.PI*2)});} 
  return {id:'curve',name:'曲线行驶',limit:0,spawn:{x:-11.2,y:0,h:0},step:0,stepText:['低速连续通过 S 弯，保持四轮不越道路边线'],path:pts,width:4.7,finishX:10.2,
    update(){const legal=carPoints().every(p=>distToPolyline(p,this.path)<=this.width/2);if(!legal)return fail('曲线行驶：车轮压越道路边线');if(car.x>this.finishX&&car.speed>0)completeProject();},
    draw(){drawGrass();drawPathRoad(this.path,this.width);if(session.guide)drawCenterPath(this.path);drawControlX(this.finishX,-4,4);}
  };
}
function makeRight(){
  return {id:'right',name:'直角转弯',limit:0,spawn:{x:-4.2,y:8.0,h:-Math.PI/2},step:0,stepText:['进入直角弯前开启右转向灯，低速完成 90° 右转'],road:[rect(-6.3,-10.3,-1.0,10),rect(-1.0,-10.3,10,-5.0)],finishX:7,signalChecked:false,
    update(){if(!carPoints().every(p=>pointInAnyRect(p,this.road)))return fail('直角转弯：车轮压越道路边线');if(car.y<-3.5&&!this.signalChecked){this.signalChecked=true;if(signal!=='right')penalty(10,'直角转弯未开启右转向灯');}if(car.x>this.finishX&&car.y<-7&&car.speed>0)completeProject();},
    draw(){drawGrass();drawRectRoad(this.road[0]);drawRectRoad(this.road[1]);drawLine(-6.3,10,-6.3,-10.3);drawLine(-6.3,-10.3,10,-10.3);drawLine(10,-10.3,10,-5.0);drawLine(10,-5.0,-1.0,-5.0);drawLine(-1.0,-5.0,-1.0,10);drawLine(-1.0,10,-6.3,10);drawControlX(this.finishX,-10.3,-5.0);if(session.guide)drawTextWorld('右转',-2.0,-4.3,'#ffd65a');}
  };
}
const makers={reverse:makeReverse,side:makeSide,curve:makeCurve,right:makeRight};

/* =========================================================
   7. Session / 计分
========================================================= */
const session={active:false,running:false,paused:false,mode:'exam',projectIndex:0,project:null,score:100,totalTime:0,projectTime:0,penalties:[],guide:false,prevCarX:0,failed:false,completed:0};
function startSession(mode,index){
  session.active=true;session.running=true;session.paused=false;session.mode=mode;session.projectIndex=index;session.score=100;session.totalTime=0;session.penalties=[];session.failed=false;session.completed=0;session.guide=true;
  homePage.style.display='none';canvas.style.display='block';hud.classList.remove('hidden');controls.classList.remove('hidden');resultOverlay.classList.add('hidden');pauseOverlay.classList.add('hidden');const failPhotoWrap=$('failPhotoWrap');if(failPhotoWrap)failPhotoWrap.classList.remove('show');
  loadProject(index); modeTag.textContent=mode==='exam'?'C2 自动挡模拟':'单项练习'; $('guideBtn').style.color=session.guide?'var(--green)':'';
}
function loadProject(index){session.projectIndex=index;const def=PROJECTS[index];session.project=makers[def.id]();session.projectTime=0;resetCar(session.project.spawn);session.prevCarX=car.x;updateHUD();toast(`开始：${session.project.name}`,'ok');}
function penalty(points,reason){if(session.failed)return;session.score=Math.max(0,session.score-points);session.penalties.push({points,reason});updateHUD();if(session.mode==='exam'&&session.score<RULES.passScore)fail('累计扣分后成绩低于 80 分');}
function fail(reason){if(session.failed)return;session.failed=true;session.running=false;session.penalties.push({points:100,reason});showResult(false,reason);}
function completeProject(){
  if(!session.running)return;toast(`${session.project.name} 完成`,'ok');
  session.completed++;
  if(session.mode==='practice'){session.running=false;setTimeout(()=>showResult(true,'单项练习完成'),500);return;}
  if(session.projectIndex>=PROJECTS.length-1){session.running=false;setTimeout(()=>showResult(session.score>=RULES.passScore,'全部项目完成'),500);}
  else {session.running=false;setTimeout(()=>{session.running=true;loadProject(session.projectIndex+1);},850);}
}
function showResult(pass,desc){
  $('resultBadge').textContent=pass?'PASS':'FAILED'; $('resultBadge').style.color=pass?'#8ff0ba':'#ff9ca1';
  $('resultTitle').textContent=pass?(session.mode==='exam'?'考试合格':'练习完成'):'考试不合格'; $('resultDesc').textContent=desc;
  const failPhotoWrap=$('failPhotoWrap');
  if(failPhotoWrap){
    failPhotoWrap.classList.toggle('show',!pass);
  }
  $('finalScore').textContent=session.score; $('finalProject').textContent=session.mode==='exam'?`${session.completed}/${PROJECTS.length}`:'1/1'; $('finalTime').textContent=formatTime(session.totalTime);
  $('penaltyList').innerHTML=session.penalties.length?session.penalties.map(p=>`<div class="penalty-item"><span>${p.reason}</span><b>-${p.points}</b></div>`).join(''):'<div class="penalty-item"><span>无扣分记录</span><b style="color:#8ff0ba">0</b></div>';
  resultOverlay.classList.remove('hidden');
}
function quitToMenu(){session.active=false;session.running=false;session.paused=false;homePage.style.display='block';canvas.style.display='none';hud.classList.add('hidden');controls.classList.add('hidden');pauseOverlay.classList.add('hidden');resultOverlay.classList.add('hidden');}
function setPause(v){if(!session.active)return;session.paused=v;pauseOverlay.classList.toggle('hidden',!v);}
function formatTime(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function toast(text,type=''){const el=$('toast');el.textContent=text;el.className=`show ${type}`;clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',1800);}
function updateHUD(){
  scoreEl.textContent=session.score;scoreEl.className=session.score>=90?'good':session.score>=80?'warn':'bad';
  projectEl.textContent=session.mode==='exam'?`${session.projectIndex+1} / ${PROJECTS.length}`:'练习'; timeEl.textContent=formatTime(session.totalTime);
  if(session.project){stageTitle.textContent=session.project.name;stageHint.textContent=session.project.stepText?.[session.project.step]||'';const lim=session.project.limit||0;timerFill.style.width=lim?`${Math.max(0,100*(1-session.projectTime/lim))}%`:'100%';timerFill.style.background=lim&&session.projectTime>lim*.8?'var(--red)':'var(--green)';}
  speedEl.textContent=(Math.abs(car.speed)*3.6).toFixed(1);gearEl.textContent=gear;rpmEl.textContent=Math.round(car.rpm);gradeEl.textContent=Math.round(car.grade*100)+'%';
}

/* =========================================================
   8. 绘制
========================================================= */
function worldToScreen(x,y){return {x:(x-camera.x)*camera.scale+innerWidth/2,y:(y-camera.y)*camera.scale+innerHeight/2};}
function beginWorld(){ctx.save();ctx.translate(innerWidth/2,innerHeight/2);ctx.scale(camera.scale,camera.scale);ctx.translate(-camera.x,-camera.y);}
function endWorld(){ctx.restore();}
function drawGrass(){ctx.fillStyle='#173722';ctx.fillRect(camera.x-30,camera.y-22,60,44);ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=.02;for(let x=Math.floor(camera.x-30);x<camera.x+30;x++){ctx.beginPath();ctx.moveTo(x,camera.y-22);ctx.lineTo(x,camera.y+22);ctx.stroke()}for(let y=Math.floor(camera.y-22);y<camera.y+22;y++){ctx.beginPath();ctx.moveTo(camera.x-30,y);ctx.lineTo(camera.x+30,y);ctx.stroke()}}
function drawRectRoad(r){ctx.fillStyle='#424944';ctx.fillRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.fillStyle='rgba(255,255,255,.02)';for(let x=r.x1;x<r.x2;x+=.7)ctx.fillRect(x,r.y1,.012,r.y2-r.y1)}
function drawLine(x1,y1,x2,y2,color='#f1cf54',w=.08){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawControlX(x,y1,y2){ctx.save();ctx.setLineDash([.25,.18]);drawLine(x,y1,x,y2,'#f5f5f5',.06);ctx.restore()}
function drawStopLine(x,y1,y2){drawLine(x,y1,x,y2,'#ffd65a',.14)}
function drawGhostBay(r,label){ctx.save();ctx.fillStyle='rgba(72,229,150,.07)';ctx.fillRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.strokeStyle='rgba(72,229,150,.4)';ctx.lineWidth=.04;ctx.setLineDash([.15,.12]);ctx.strokeRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.restore();drawTextWorld(label,(r.x1+r.x2)/2,(r.y1+r.y2)/2,'rgba(180,255,213,.75)')}
function drawTextWorld(t,x,y,color='#fff'){ctx.save();ctx.scale(1/camera.scale,1/camera.scale);ctx.font='700 11px sans-serif';ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(t,x*camera.scale,y*camera.scale);ctx.restore()}
function drawSlope(x1,x2,y1,y2){ctx.save();ctx.fillStyle='rgba(255,214,90,.08)';ctx.fillRect(x1,y1,x2-x1,y2-y1);ctx.strokeStyle='rgba(255,214,90,.18)';ctx.lineWidth=.04;for(let x=x1;x<x2;x+=.45){ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x+.5,y2);ctx.stroke()}ctx.restore()}
function drawPathRoad(pts,width){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#424944';ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(const p of pts)ctx.lineTo(p.x,p.y);ctx.stroke();ctx.strokeStyle='#f1cf54';ctx.lineWidth=.08;ctx.beginPath();const off=width/2; // 用采样法画两条近似边线
  const left=[],right=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],ang=Math.atan2(b.y-a.y,b.x-a.x),nx=-Math.sin(ang),ny=Math.cos(ang);left.push({x:pts[i].x+nx*off,y:pts[i].y+ny*off});right.push({x:pts[i].x-nx*off,y:pts[i].y-ny*off});}
  ctx.beginPath();ctx.moveTo(left[0].x,left[0].y);left.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.beginPath();ctx.moveTo(right[0].x,right[0].y);right.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
function drawCenterPath(pts){ctx.save();ctx.setLineDash([.25,.22]);ctx.strokeStyle='rgba(72,229,150,.45)';ctx.lineWidth=.04;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.restore()}
function drawLBoundary(){
  // L 型道路边界，黄色实线
  drawLine(-6,10,-6,-10);drawLine(-6,-10,10,-10);drawLine(10,-10,10,-5.3);drawLine(10,-5.3,-1.3,-5.3);drawLine(-1.3,-5.3,-1.3,10);drawLine(-1.3,10,-6,10);
}
function roundedRectPath(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));}
function drawCar(){
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.heading);
  // 阴影
  ctx.fillStyle='rgba(0,0,0,.30)';roundedRectPath(-CAR.length/2+.12,-CAR.width/2+.16,CAR.length,CAR.width,.25);ctx.fill();
  // 轮胎
  const steer=input.steer*CAR.maxSteer; const wheelX=CAR.wheelbase/2, rearX=-CAR.wheelbase/2, wheelY=CAR.width/2+.03;
  function wheelDraw(x,y,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#101312';roundedRectPath(-.34,-.10,.68,.20,.05);ctx.fill();ctx.restore()}
  wheelDraw(wheelX,wheelY,steer);wheelDraw(wheelX,-wheelY,steer);wheelDraw(rearX,wheelY);wheelDraw(rearX,-wheelY);
  // 车身
  const grad=ctx.createLinearGradient(-CAR.length/2,0,CAR.length/2,0);grad.addColorStop(0,'#dfe9e3');grad.addColorStop(.55,'#ffffff');grad.addColorStop(1,'#b9c8c0');ctx.fillStyle=grad;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.035;roundedRectPath(-CAR.length/2,-CAR.width/2,CAR.length,CAR.width,.32);ctx.fill();ctx.stroke();
  // 车窗
  ctx.fillStyle='#17231d';roundedRectPath(-.65,-CAR.width*.39,1.55,CAR.width*.78,.18);ctx.fill();
  // 前后灯
  ctx.fillStyle='#e8f6ff';ctx.fillRect(CAR.length/2-.08,-CAR.width*.34,.08,.38);ctx.fillRect(CAR.length/2-.08,CAR.width*.34-.38,.08,.38);ctx.fillStyle='#ff6268';ctx.fillRect(-CAR.length/2,-CAR.width*.34,.07,.34);ctx.fillRect(-CAR.length/2,CAR.width*.34-.34,.07,.34);
  // 车顶图片
  const roof=roofImgs[roofIndex];const rw=1.18,rh=1.02;ctx.save();roundedRectPath(-.18-rw/2,-rh/2,rw,rh,.12);ctx.clip();if(roof.complete&&roof.naturalWidth){ctx.drawImage(roof,-.18-rw/2,-rh/2,rw,rh)}else{ctx.fillStyle='#43d98d';ctx.fillRect(-.18-rw/2,-rh/2,rw,rh);ctx.fillStyle='#06100b';ctx.font='.22px sans-serif';ctx.textAlign='center';ctx.fillText('ROOF',-.18,.06)}ctx.restore();
  // 转向灯闪烁
  if(Math.floor(performance.now()/350)%2===0){ctx.fillStyle='#ffcf45';if(signal==='left'){ctx.fillRect(CAR.length/2-.12,-CAR.width/2-.03,.16,.08);ctx.fillRect(-CAR.length/2-.04,-CAR.width/2-.03,.16,.08)}if(signal==='right'){ctx.fillRect(CAR.length/2-.12,CAR.width/2-.05,.16,.08);ctx.fillRect(-CAR.length/2-.04,CAR.width/2-.05,.16,.08)}}
  ctx.restore();
}
function drawTrajectory(){if(!session.guide)return;const steer=input.steer*CAR.maxSteer;if(Math.abs(steer)<.02)return;const radius=CAR.wheelbase/Math.tan(steer);ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.heading);ctx.strokeStyle='rgba(107,197,255,.45)';ctx.lineWidth=.035;ctx.setLineDash([.16,.12]);ctx.beginPath();ctx.arc(0,radius,Math.abs(radius),-Math.PI/2*(Math.sign(radius)),(-Math.PI/2+1.0)*(Math.sign(radius)),radius<0);ctx.stroke();ctx.restore()}
function drawScene(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#07110c';ctx.fillRect(0,0,innerWidth,innerHeight);if(!session.active||!session.project)return;camera.scale=innerWidth<700?(innerHeight>innerWidth?35:44):58;camera.x+=(car.x-camera.x)*.08;camera.y+=(car.y-camera.y)*.08;beginWorld();session.project.draw();drawTrajectory();drawCar();endWorld();}

/* =========================================================
   9. 主循环
========================================================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  if(session.active&&!session.paused){
    if(session.running){session.totalTime+=dt;session.projectTime+=dt;session.prevCarX=car.x;updateCar(dt);session.project.update(dt);if(session.project.limit&&session.projectTime>session.project.limit)fail(`${session.project.name} 超过规定时间`);}
    updateHUD();
  }
  drawScene();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
