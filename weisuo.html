<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>随机运动照片</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
  touch-action: manipulation;
}

#photo {
  position: absolute;
  width: 28vmin;
  height: 28vmin;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
}

#photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#tip {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.75);
  font-size: 14px;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: rgba(0, 0, 0, 0.45);
  padding: 10px 18px;
  border-radius: 999px;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="photo">
  <!-- 这里就是你仓库里真实图片完整名字，一字不差 -->
  <img src="f57b7468deb628469350c27aad31d26e.png" alt="照片" />
</div>

<div id="tip">点击照片暂停 / 继续</div>

<script>
const photo = document.getElementById("photo");

let posX = window.innerWidth * 0.1;
let posY = window.innerHeight * 0.1;
let velX = (Math.random() * 2.5 + 1.5) * (Math.random() > 0.5 ? 1 : -1);
let velY = (Math.random() * 2.5 + 1.5) * (Math.random() > 0.5 ? 1 : -1);
let running = true;

function update() {
  if (!running) return;

  posX += velX;
  posY += velY;

  const maxX = window.innerWidth - photo.clientWidth;
  const maxY = window.innerHeight - photo.clientHeight;

  if (posX <= 0) {
    posX = 0;
    velX = Math.abs(velX);
    randomSpeed();
  }

  if (posX >= maxX) {
    posX = maxX;
    velX = -Math.abs(velX);
    randomSpeed();
  }

  if (posY <= 0) {
    posY = 0;
    velY = Math.abs(velY);
    randomSpeed();
  }

  if (posY >= maxY) {
    posY = maxY;
    velY = -Math.abs(velY);
    randomSpeed();
  }

  photo.style.transform = `translate(${posX}px, ${posY}px)`;
  requestAnimationFrame(update);
}

function randomSpeed() {
  const change = Math.random() * 0.6 + 0.7;
  velX *= change;
  velY *= change;

  const maxSpeed = 5.5;
  const minSpeed = 0.8;

  velX = Math.max(minSpeed, Math.min(maxSpeed, Math.abs(velX))) * (velX < 0 ? -1 : 1);
  velY = Math.max(minSpeed, Math.min(maxSpeed, Math.abs(velY))) * (velY < 0 ? -1 : 1);
}

photo.addEventListener("click", () => {
  running = !running;
  if (running) update();
});

window.addEventListener("resize", () => {
  const maxX = window.innerWidth - photo.clientWidth;
  const maxY = window.innerHeight - photo.clientHeight;
  posX = Math.min(posX, maxX);
  posY = Math.min(posY, maxY);
});

update();
</script>

</body>
</html>
